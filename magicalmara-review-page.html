<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leave a Review — Magical Mara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Karla:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --mm-bg:#FBFAF9;
  --mm-card:#FFFFFF;
  --mm-line:#E9E4F0;
  --mm-ink:#1F1235;
  --mm-ink-2:#645C78;
  --mm-violet:#5B3F8C;
  --mm-violet-dk:#472F71;
  --mm-violet-lt:#F3EFFA;
  --mm-amber:#B07D1A;
  --mm-display:'Cormorant Garamond',Georgia,serif;
  --mm-body:'Karla',system-ui,-apple-system,sans-serif;
  --mm-radius:14px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--mm-bg);color:var(--mm-ink);font-family:var(--mm-body);line-height:1.6;-webkit-font-smoothing:antialiased;padding:40px 20px}
.wrap{max-width:480px;margin:0 auto}
.card{background:var(--mm-card);border:1px solid var(--mm-line);border-radius:var(--mm-radius);padding:36px 30px;text-align:center}
h1{font-family:var(--mm-display);font-weight:600;font-size:28px;margin:0 0 8px}
p.sub{color:var(--mm-ink-2);font-size:15px;margin:0 0 28px}
fieldset{border:0;padding:0;margin:0 0 20px}
.stars{display:flex;flex-direction:row-reverse;justify-content:center;gap:4px}
.stars input{display:none}
.stars label{font-size:34px;color:var(--mm-line);cursor:pointer;transition:color .15s}
.stars input:checked ~ label,
.stars label:hover,
.stars label:hover ~ label{color:var(--mm-amber)}
label.field-label{display:block;text-align:left;font-size:13px;font-weight:600;color:var(--mm-ink-2);margin:0 0 6px;text-transform:uppercase;letter-spacing:.04em}
textarea,input[type=text]{width:100%;border:1px solid var(--mm-line);border-radius:10px;padding:12px 14px;font-family:var(--mm-body);font-size:15px;color:var(--mm-ink);margin-bottom:18px;resize:vertical}
textarea{min-height:90px}
button{width:100%;background:var(--mm-violet);color:#fff;border:0;border-radius:999px;padding:14px 20px;font-family:var(--mm-body);font-weight:600;font-size:15px;cursor:pointer;transition:background .15s}
button:hover{background:var(--mm-violet-dk)}
.divider{display:flex;align-items:center;gap:12px;margin:28px 0;color:var(--mm-ink-2);font-size:13px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--mm-line)}
.google-btn{display:inline-block;width:100%;background:var(--mm-violet-lt);color:var(--mm-violet-dk);text-decoration:none;border-radius:999px;padding:14px 20px;font-weight:600;font-size:15px}
.thankyou{display:none}
.thankyou.show{display:block}
.formwrap.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>How was your session?</h1>
    <p class="sub">Your words can help others feel confident stepping into their own healing journey.</p>

    <div class="formwrap" id="formwrap">
      <form id="reviewForm" action="https://formspree.io/f/myeyrqlr" method="POST">
        <fieldset>
          <div class="stars">
            <input type="radio" id="star5" name="rating" value="5"><label for="star5">★</label>
            <input type="radio" id="star4" name="rating" value="4"><label for="star4">★</label>
            <input type="radio" id="star3" name="rating" value="3"><label for="star3">★</label>
            <input type="radio" id="star2" name="rating" value="2"><label for="star2">★</label>
            <input type="radio" id="star1" name="rating" value="1"><label for="star1">★</label>
          </div>
        </fieldset>

        <label class="field-label" for="comment">Your comment (optional)</label>
        <textarea id="comment" name="comment" placeholder="Tell us about your experience..."></textarea>

        <label class="field-label" for="name">Your name (optional)</label>
        <input type="text" id="name" name="name" placeholder="Your name">

        <button type="submit">Submit Review</button>
      </form>
    </div>

    <div class="thankyou" id="thankyou">
      <p style="font-family:var(--mm-display);font-size:22px;color:var(--mm-violet-dk);margin:20px 0">Thank you for sharing 🙏</p>
      <p class="sub" style="margin:0">Your feedback means so much to me.</p>
    </div>

    <div class="divider">or</div>

    <a class="google-btn" href="https://g.page/11nn37bbyk/review" target="_blank" rel="noopener">📍 Leave a Google Review</a>
  </div>
</div>

<script>
document.getElementById('reviewForm').addEventListener('submit', function(e){
  e.preventDefault();
  var form = e.target;
  var data = new FormData(form);
  fetch(form.action, {
    method: 'POST',
    body: data,
    headers: { 'Accept': 'application/json' }
  }).then(function(response){
    if (response.ok) {
      document.getElementById('formwrap').classList.add('hide');
      document.getElementById('thankyou').classList.add('show');
    } else {
      alert('Something went wrong submitting your review — please try again.');
    }
  }).catch(function(){
    alert('Something went wrong submitting your review — please try again.');
  });
});
</script>
</body>
</html>
